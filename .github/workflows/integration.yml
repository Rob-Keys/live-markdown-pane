name: Integration

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  vscode-integration:
    name: ${{ matrix.os }} · Node ${{ matrix.node }} · VS Code ${{ matrix.vscode }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        node: ["26.13.0"]
        vscode: ["1.85.0", stable]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Pin npm
        run: npm install --global npm@12.2.1

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Run integration suite
        if: matrix.vscode == 'stable' && runner.os != 'Linux'
        env:
          VSCODE_VERSION: stable
        run: npm run test:integration

      - name: Run minimum-version integration suite
        if: matrix.vscode == '1.85.0' && runner.os != 'Linux'
        run: npm run test:minimum

      - name: Run Linux integration suite with virtual display
        if: runner.os == 'Linux'
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
        run: |
          if [ "${{ matrix.vscode }}" = "1.85.0" ]; then
            xvfb-run -a npm run test:minimum
          else
            xvfb-run -a npm run test:integration
          fi
