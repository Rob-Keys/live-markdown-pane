name: Integration

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  vscode-integration:
    name: ${{ matrix.os }} · VS Code ${{ matrix.vscode }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        vscode: ["1.85.0", stable]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Run integration suite
        if: matrix.vscode == 'stable' && runner.os != 'Linux'
        env:
          VSCODE_VERSION: stable
        run: npm run test:integration

      - name: Run minimum-version integration suite
        if: matrix.vscode == '1.85.0' && runner.os != 'Linux'
        run: npm run test:minimum

      - name: Run Linux integration suite with virtual display
        if: runner.os == 'Linux'
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
        run: |
          if [ "${{ matrix.vscode }}" = "1.85.0" ]; then
            xvfb-run -a npm run test:minimum
          else
            xvfb-run -a npm run test:integration
          fi
